# F-Droid build recipe for GLTF Viewer - reference copy.
#
# F-Droid does not read this file from this repo. To submit:
#   1. Fork https://gitlab.com/fdroid/fdroiddata
#   2. Copy this file to metadata/io.kammarc.gltfviewer.yml there
#   3. Open a merge request (see https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/)
#
# The store listing (title, descriptions, screenshots, changelogs) comes from
# fastlane/metadata/android/ in this repo, so it is not repeated here.

Categories:
  - Multimedia
License: MIT
AuthorName: Marc Kammermann
SourceCode: https://github.com/kammarc/gltfViewerDroid
IssueTracker: https://github.com/kammarc/gltfViewerDroid/issues
Changelog: https://github.com/kammarc/gltfViewerDroid/tree/HEAD/fastlane/metadata/android/en-US/changelogs

AutoName: GLTF Viewer

RepoType: git
Repo: https://github.com/kammarc/gltfViewerDroid.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.6
    # The jni package (via shared_preferences/file_picker) compiles native
    # code; this is the NDK that Flutter 3.44.6 pins.
    ndk: 28.2.13676358
    rm:
      - ios
      - macos
      - linux
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
